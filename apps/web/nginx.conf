server {
    listen 80;
    root /usr/share/nginx/html;

    location = /api/health {
        proxy_pass http://api:3000/health;
    }

    location = /metrics {
        proxy_pass http://api:3000/metrics;
    }

    location /api/ {
        proxy_pass http://api:3000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
